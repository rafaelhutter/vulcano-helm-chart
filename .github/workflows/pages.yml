name: Publish Helm chart to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Helm dependencies
        run: helm dependency update

      - name: Package chart and generate index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          # Pages is replaced wholesale on every deploy, so the index must be
          # rebuilt from every .tgz that is already published, not just the current one.
          BASE=https://rafaelhutter.github.io/vulcano-helm-chart
          curl -fsSL "$BASE/index.yaml" -o /tmp/live-index.yaml || : > /tmp/live-index.yaml
          grep -oE "$BASE/vulcano-[^ ]+\\.tgz" /tmp/live-index.yaml | sort -u | while read -r u; do
            curl -fsSL "$u" -o "public/$(basename "$u")" || rm -f "public/$(basename "$u")"
          done
          for tag in $(gh release list --limit 500 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern 'vulcano-*.tgz' --dir public --clobber
          done
          cp vulcano-*.tgz public/ 2>/dev/null || true
          helm package . --destination public
          helm repo index public --url https://rafaelhutter.github.io/vulcano-helm-chart

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
