# Project Configuration
project:
  # -- URLs to send project data to external systems
  sendToUrls: ""
  delete:
    # -- Only allow project deletion by the owner
    ownerOnly: "true"

# Authentication Configuration
# Admin access (Vulcano 1.9.31+): in addition to the `adminUsers` list below,
# the UI grants admin to any user whose login token carries the role
# `vulcano-admin` — a Keycloak realm role or `vulcano` client role, or a
# Microsoft Entra ID (Azure AD) App Role of the same value. The role is read
# from the token at login, so a role change requires the user to re-login.
# This is configured in the identity provider; no chart setting is required.
auth:
  # -- Authentication mode (MICROSOFT, KEYCLOAK, HELMUT, BID)
  mode: "MICROSOFT"
  microsoft:
    # -- Microsoft Azure AD authority URL (used by MICROSOFT and BID modes)
    authority:
    # -- Microsoft Azure AD client ID (used by MICROSOFT and BID modes)
    clientId:
  # -- Service admin password for authentication. Stored in the vulcano-credentials
  # Secret and shared by the vulcano, dflconnector and filetransfer deployments.
  serviceAdminPassword:
  # -- Name of an existing K8s Secret holding the service admin password. When set,
  # serviceAdminPassword is ignored, the chart does NOT write it to vulcano-credentials,
  # and all three deployments read it from this Secret (keeps it out of values/Git).
  serviceAdminPasswordExistingSecret: ""
  # -- Key inside serviceAdminPasswordExistingSecret that holds the password.
  serviceAdminPasswordExistingSecretKey: "service-admin-password"
  keycloak:
    # -- Keycloak authority URL
    authority:
    # -- Keycloak client ID
    clientId:
    # -- Keycloak client secret
    clientSecret:
    # -- Name of an existing K8s Secret containing the Keycloak client secret (when set, clientSecret is ignored)
    existingSecret: ""
    # -- Key inside existingSecret that holds the client secret
    existingPasswordKey: "keycloak-client-secret"
  # -- Authentication token-signing secret. Stored in the vulcano-credentials
  # Secret (never the ConfigMap). Leave empty to keep the chart default.
  secret:
  # -- Name of an existing K8s Secret holding the auth token-signing secret.
  # When set, `secret` is ignored, the chart does NOT write it to
  # vulcano-credentials, and the deployment reads it from this Secret.
  secretExistingSecret: ""
  # -- Key inside secretExistingSecret that holds the auth secret.
  secretExistingSecretKey: "auth-secret"

# Admin Users
# -- List of email addresses for users with administrative privileges. One email per line. These users will have full system access including project deletion and user management.
adminUsers: |
  admin1@domain.com
  admin2@domain.com

# Tomcat Configuration
tomcat:
  multipart:
    # -- Maximum file size for multipart uploads
    maxFileSize: "1000MB"
    # -- Maximum request size for multipart uploads
    maxRequestSize: "1000MB"

# Network Configuration
# -- Node selector for pod scheduling
nodeSelector: {}
# -- Tolerations for pod scheduling on tainted nodes
tolerations: []
# -- Affinity rules for pod scheduling
affinity: {}
# -- Static /etc/hosts entries injected into the Vulcano pod. Useful when the
# pod must reach a hostname that the cluster cannot resolve to an internal
# address (e.g. a self-hosted Keycloak whose public hostname does not NAT-loop
# back into the cluster). Each item: { ip: <addr>, hostnames: [<host>, ...] }.
hostAliases: []

# -- Extra Kubernetes objects to deploy alongside the chart.
# Useful for BitwardenSecrets, custom PVCs, StorageClasses, or any other resource.
# Supports templating via tpl – you can reference .Release.Name, .Values, etc.
# Example (Bitwarden Secrets Manager):
# extraObjects:
#   - apiVersion: k8s.bitwarden.com/v1
#     kind: BitwardenSecret
#     metadata:
#       name: rabbitmq
#       namespace: "{{ .Release.Namespace }}"
#     spec:
#       organizationId: "<org-id>"
#       secretName: bw-rabbitmq-secrets
#       map:
#         - bwSecretId: <uuid>
#           secretKeyName: "rabbitmq-password"
#         - bwSecretId: <uuid>
#           secretKeyName: "rabbitmq-erlang-cookie"
#       authToken:
#         secretName: bw-auth-token
#         secretKey: token
extraObjects: []

# Data Feed Mapping Configuration
dataFeedMapping:
  # -- Skip Asset Creation for Updates from Datafeed
  skipUpdates: "false"
  # -- Ignore Delete Messages from Datafeed
  ignoreDelete: "false"
