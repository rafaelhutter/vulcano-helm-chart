## Vulcano Helm Chart Values
## Complete application deployment with MongoDB, RabbitMQ, and optional CSI driver

# -- Override the chart name
nameOverride: ""
# -- Override the full release name. Defaults to "vulcano" (not the release
# name) so upgrades keep matching resource names already live in every
# existing deployment; the fullname helper would otherwise rename Deployment/
# Service/ConfigMaps/Ingress to the release name and orphan the originals.
fullnameOverride: "vulcano"

# -- Labels to add to all deployed objects
commonLabels: {}
# -- Annotations to add to all deployed objects
commonAnnotations: {}

# -- Global configuration for the Vulcano deployment
global:
  # -- Kubernetes namespace for the deployment
  namespace: "vulcano-app"

# -- Docker Image Configuration
images:
  vulcano:
    # -- Docker repository for Vulcano application
    repository: "moovit/vulcano"
    # -- Docker image tag
    tag: "2026.1.19"
    # -- Image pull policy
    pullPolicy: "IfNotPresent"

  filetransfer:
    repository: "moovit/vulcano-filetransfer"
    tag: "0.0.14"
    pullPolicy: "IfNotPresent"

  dflconnector:
    repository: "moovit/de.moovit.vulcano-dfl-connector"
    tag: "0.2.20"
    pullPolicy: "IfNotPresent"

# -- Image Pull Secrets configuration
imagePullSecrets:
  # -- Enable image pull secrets
  enabled: true
  secrets:
    - name: docker-io

# Vulcano Backend Service Configuration
vulcano:
  enabled: true
  replicaCount: 1
  # -- Deployment update strategy. Leave empty for auto-detect (recommended):
  # the chart picks "RollingUpdate" when ALL volumes are ReadWriteMany, and
  # falls back to "Recreate" if any volume is ReadWriteOnce – otherwise a
  # rolling update would hit a Multi-Attach error when the new pod is
  # scheduled on a different node than the old one. Volumes backed by an
  # existingClaim are assumed ReadWriteMany. Set explicitly to
  # "Recreate" or "RollingUpdate" to override.
  strategy: ""
  service:
    # -- Service type (ClusterIP, NodePort, LoadBalancer)
    type: ClusterIP
    # -- Service port
    port: 8889
    # -- Target port
    targetPort: 8889

  ingress:
    # -- Enable ingress (legacy Ingress API). See the `gateway` block below for
    # the Gateway API alternative.
    enabled: true
    # ⚠️ ingress-nginx is RETIRED: upstream maintenance halted in March 2026 — no
    # further releases, bug-fixes, or security patches. Existing installs keep
    # working, but plan a migration. Options: the opt-in Gateway API support in the
    # `vulcano.gateway` block below, or a maintained alternative Ingress controller.
    # https://kubernetes.io/blog/2025/11/11/ingress-nginx-retirement/
    # -- Ingress class name
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "500m"
      # Stream responses straight through instead of spooling the full body —
      # required for fast /hires downloads and HTTP Range requests.
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-max-temp-file-size: "0"
      nginx.ingress.kubernetes.io/server-snippets: |
        location /ws {
         proxy_set_header Upgrade $http_upgrade;
         proxy_http_version 1.1;
         proxy_set_header X-Forwarded-Host $http_host;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-For $remote_addr;
         proxy_set_header Host $host;
         proxy_set_header Connection "upgrade";
         proxy_cache_bypass $http_upgrade;
        }
    # -- Ingress hosts (supports multiple domains)
    hosts:
      - "vulcano.example.com"
    path: "/"
    # -- Enable TLS
    tls:
      enabled: false
      # Certificate source: "letsencrypt" or "existing"
      source: "letsencrypt" # Options: letsencrypt, existing
      # For Let's Encrypt (when source=letsencrypt)
      letsencrypt:
        enabled: false
        clusterIssuer: "letsencrypt-prod" # or letsencrypt-staging
        email: "admin@example.com"
      # For existing certificate (when source=existing)
      existing:
        secretName: "tls-vulcano-cert"

  # Gateway API routing – the forward-looking alternative to the legacy Ingress
  # above (ingress-nginx is retired, see the note there). Disabled by default;
  # the Ingress remains the default path. When enabled, the chart renders an
  # HTTPRoute that attaches to a Gateway you provision cluster-side (with its
  # own TLS listener) – the idiomatic Gateway API split of concerns.
  # Requires the Gateway API CRDs (gateway.networking.k8s.io/v1) and a Gateway
  # controller (e.g. Envoy Gateway, Istio, Cilium, NGINX Gateway Fabric).
  gateway:
    # -- Enable Gateway API routing (renders an HTTPRoute). Mutually independent
    # from `ingress.enabled` – do not enable both for the same host.
    enabled: false
    # -- Reference to the existing Gateway this route attaches to.
    parentRef:
      # -- Name of the Gateway (required when gateway.enabled=true)
      name: ""
      # -- Namespace of the Gateway (defaults to the release namespace when empty)
      namespace: ""
      # -- Listener section name on the Gateway (optional; e.g. "https")
      sectionName: ""
    # -- Hostnames for the route. Falls back to `vulcano.ingress.hosts` when empty.
    hostnames: []
    # -- Path prefix to match
    path: "/"
    # -- Request timeouts (Gateway API v1) – generous defaults for slow renders
    # and large /hires downloads, mirroring the legacy nginx proxy timeouts.
    timeouts:
      request: "3600s"
      backendRequest: "3600s"
    # NOTE: WebSocket upgrades (/ws) pass through natively on conformant
    # gateways. Request body-size limits and response buffering are
    # controller-specific policy (e.g. a BackendTrafficPolicy / ClientTrafficPolicy),
    # not part of the portable HTTPRoute spec – configure them on your Gateway.

  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "2Gi"
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # Storage configuration
  storage:
    mountPath: "/data"
    # -- Name of the PVC that is created by the chart (used when existingClaim is empty)
    pvc: "smb-vulcano-data"
    size: "10Gi"
    # -- Storage class for the PVC (leave empty for cluster default, set to "-" to omit storageClassName entirely)
    storageClass: "longhorn"
    # -- Access mode for the PVC. Defaults to ReadWriteMany: the primary volume
    # is shared by the vulcano and filetransfer pods (and layered extraMounts),
    # which need concurrent access across nodes. RWX also lets the deployment
    # strategy auto-derive to RollingUpdate. Use ReadWriteOnce only for a
    # single-pod install on RWO-only storage.
    accessModes: ReadWriteMany
    # -- Additional labels for the PVC
    labels: {}
    # -- Annotations for the PVC.
    # Example: set helm.sh/resource-policy: keep to prevent deletion on helm uninstall
    annotations: {}
    #   helm.sh/resource-policy: keep
    # -- Name of an existing PVC to mount instead of creating a new one.
    # When set, no PVC is created by the chart. Useful for custom CSI storage classes or pre-provisioned PV/PVCs.
    # The PVC/PV itself can be deployed via extraObjects.
    existingClaim: ""

    # -- Additional per-folder mounts layered on top of the primary mount.
    # Each entry is mounted on both the vulcano and filetransfer pods so the
    # file tree stays consistent (filetransfer mounts read-only).
    #
    # Each item requires `name` + `mountPath`, plus EITHER:
    #   - `existingClaim`: use a pre-provisioned PVC (chart creates nothing), OR
    #   - `pvc` (+ optional `size`/`accessModes`/`storageClass`/`labels`/`annotations`):
    #     chart templates a fresh PVC for the entry.
    extraMounts: []
    # Example:
    # extraMounts:
    #   - name: highres
    #     mountPath: "/data/highres"
    #     existingClaim: "vulcano-highres-fast-nvme"
    #   - name: highres-templates
    #     mountPath: "/data/highres_templates"
    #     pvc: "vulcano-highres-templates"
    #     size: "200Gi"
    #     accessModes: "ReadWriteMany"
    #     storageClass: "longhorn"

  # Application configuration
  # -- Custom subtitle text displayed in the web interface header
  subtitle: ""
  # -- Enable download functionality for rendered assets in the web interface
  allowDownload: "true"
  # -- Allow creation of assets with duplicate names
  allowDuplicates: "true"
  # -- Enable line breaks in text properties by default when creating new assets
  allowLinebreaksByDefault: "false"
  autologout:
    # -- Completely disable automatic logout functionality
    disable: "false"
    # -- Number of hours of inactivity before users are automatically logged out
    hours: "1"
  # -- HTTP endpoint URL that receives completed asset data and can MODIFY it before final storage
  completedAssetInterceptor: ""
  # -- HTTP webhook URL for NOTIFICATION purposes only - receives completed asset data but cannot modify it
  completedWebhook: ""
  # -- HTTP endpoint URL that will be called when a new asset is created
  createAssetInterceptor: ""
  folder:
    # -- Enable creation of user-specific folders for organizing generated assets
    createUserFolder: "false"
    # -- Global parent folder path component inserted in generated asset folder structure when user folders are enabled
    globalParent: ""
  frontend:
    # -- If enabled, a Timecode input will appear in the PreferenceView for assets
    enableTimecodeForAssets: "false"
  home:
    base: "/home"
  # -- Maximum number of template properties that can be used in auto-generated asset names
  maxPropertiesInNames: "5"
  # -- Maximum character length for individual property values used in asset names
  maxPropertyLength: "10"
  media:
    dockerHighresPath: ""
  output:
    # -- Template pattern for PatternBasedOutputNameGenerator using placeholder syntax
    namePattern: ""
  panel:
    # -- Require authentication for the Adobe Premiere Pro panel
    loginRequired: "true"
  projects:
    # -- Sorting criteria for project lists in searchProjects API
    sortBy: "NAME"
  # -- Automatically load and display projects when the main page is opened
  searchProjectOnPageOpen: "true"
  # -- Controls whether the frontend displays all bins in the project structure or only those with content
  showAllBins: "false"
  # -- Allow users to specify custom filenames when creating assets instead of using auto-generated names
  useCustomFileName: "false"
  webconfig:
    # -- Disable the web-based configuration interface
    disable: "false"

  # -- JWT license key for application licensing.
  # Stored in a Secret (vulcano-credentials), never the ConfigMap. To keep the
  # key out of values.yaml/Git entirely, leave `key` empty and reference an
  # externally managed Secret via `existingSecret`.
  license:
    # -- License JWT. When set (and existingSecret is empty), written to the
    # vulcano-credentials Secret under key `license-key`.
    key: ""
    # -- Name of an existing Secret holding the license key. When set, `key` is
    # ignored and the chart does NOT store the license in vulcano-credentials.
    existingSecret: ""
    # -- Key inside existingSecret that holds the license JWT (default: license-key).
    existingSecretKey: "license-key"

  # -- Additional environment variables injected into the vulcano container.
  # Useful for settings the chart does not expose directly.
  extraEnvVars: []
  # - name: CUSTOM_VAR
  #   value: "custom-value"
  # - name: SECRET_VAR
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: secret-key

  graphicGenerator:
    rendition:
      # -- Comma-separated list of named output formats produced by the
      # graphics generator (e.g. social-media renditions). Format:
      # "Name1=WxH,Name2=WxH". Empty disables custom format generation.
      # Used by the Packaging Machine (Beta, Vulcano 1.9.31+). NOTE: the
      # Packaging Machine also requires the reframer binary on every render
      # node (`vulcano.media.reframer`); that is a per-render-node setting and
      # is out of scope for this server chart.
      formats: "Facebook=1080x1920,Instagram=1080x1080"

# ---------------------------------------------------------------------------
# Filetransfer – optional standalone Deployment
# Connects to the Vulcano backend via the K8s service "vulcano" in the same namespace.
# ---------------------------------------------------------------------------
filetransfer:
  enabled: false
  name: vulcano-transfer # K8s Service name – must match Vulcano's configured transfer service URL
  port: 8999
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  properties:
    # server.port is derived from filetransfer.port; vulcano.baseUrl from the
    # Vulcano Service – both injected by the template, do not set them here.
    springdoc.api-docs.path: "/api-docs"
    springdoc.swagger-ui.path: "/docs"
    # Absolute path where transferred files are written (must match the mounted PVC path)
    # Only relevant when transfer.type is "ftp" or "sftp" – set per deployment, not globally
    # transfer.destination: "/path/to/destination"
    # Log all incoming API requests for debugging
    transfer.logApiRequests: "false"
    # Transfer protocol / mode: ftp, sftp, or zdf (ZDF Upload Portal via TUS)
    transfer.type: ""
    # vulcano.username is always "service_admin" – injected automatically by the template
    # vulcano.password is injected automatically from auth.serviceAdminPassword – do not set here

  # ZDF Upload Portal targets – only required when transfer.type is "zdf".
  # Rendered as /zdf-targets.json inside the container (mounted via ConfigMap).
  # Each key is the target name used in the API call; value holds the ZDF invite code.
  # zdfTargets:
  #   TARGET1:
  #     inviteCode: ""  # sensitive – set via values.secret.yaml
  #   TARGET2:
  #     inviteCode: ""  # sensitive – set via values.secret.yaml

# ---------------------------------------------------------------------------
# DFL-Connector – optional standalone Deployment
# Connects to the Vulcano backend via the K8s service "vulcano" in the same namespace.
# Requires MongoDB from vulcano-common namespace.
# ---------------------------------------------------------------------------
dflconnector:
  enabled: false
  port: 8080
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  properties:
    # server.port is derived from dflconnector.port; vulcano.base.url from the
    # Vulcano Service – both injected by the template, do not set them here.
    # MongoDB connection is derived from the chart-level mongodb configuration:
    # host     → mongodb.externalHost or internal service DNS
    # database → mongodb.database
    # username/password → mongodb-credentials secret (or mongodb.auth.existingSecret)
    logstash.enabled: "false"
    logging.level.root: "INFO"
    logging.level.de.moovit.vulcanodflconnector: "INFO"
    # vulcano.base.service_admin_username is always "service_admin" – injected automatically by the template
    # vulcano.base.service_admin_password is injected automatically from auth.serviceAdminPassword – do not set here
    # Log all outgoing Vulcano HTTP requests for debugging
    vulcano.logRequests: "false"
    # In-memory DB-cache: evict entries after this many minutes
    vulcano.cache.db.expireAfterWriteMinutes: "15"
    vulcano.cache.db.maximumSize: "1000"
    # In-memory HTTP-cache: evict entries after this many minutes
    vulcano.cache.http.expireAfterWriteMinutes: "1"
    vulcano.cache.http.maximumSize: "500"
    # DFL competition IDs to subscribe to (comma-separated, e.g. DFL-COM-000001)
    vulcano.dfl.competitionId: ""
    # DFL season ID (e.g. DFL-SEA-0001K9)
    vulcano.dfl.seasonId: ""
    # Live-table parameter identifiers (comma-separated)
    vulcano.dfl.liveTableParameters: ""
    # Comma-separated list of DFL service identifiers to subscribe to
    vulcano.dfl.services: ""
    # DFL REST endpoint templates – usually no need to change
    vulcano.dfl.listOfServicesUrl: "https://httpget.distribution.production.datahub-sts.de/DeliveryPlatform/REST/ListOfServices/{clientId}"
    vulcano.dfl.pullOnceUrl: "https://httpget.distribution.production.datahub-sts.de/DeliveryPlatform/REST/PullOnce/{clientId}/{serviceId}/{parameterId}"
    vulcano.dfl.serviceInformationUrl: "https://httpget.distribution.production.datahub-sts.de/DeliveryPlatform/REST/ServiceInformation/{clientId}/{serviceId}"
    # DFL WebSocket endpoint – usually no need to change
    vulcano.dfl.websocket.url: "wss://ws.distribution.production.datahub-sts.de/DeliveryPlatform/websocket/ServiceRegistration"
    # DFL client credentials assigned by DFL
    vulcano.dfl.websocket.clientId: ""
    vulcano.dfl.websocket.clientName: "Vulcano"
    # WebSocket timeout and size settings (in milliseconds unless noted)
    vulcano.dfl.websocket.connect-timeout: "30000"
    vulcano.dfl.websocket.message-timeout: "300000"
    vulcano.dfl.websocket.max-message-size: "50MB"
    vulcano.dfl.websocket.ping-interval-seconds: "10"
    vulcano.dfl.websocket.pong-timeout-millis: "20000"

# -- MongoDB Configuration
mongodb:
  # -- Enable MongoDB deployment as part of this release.
  # Set to false when using an external MongoDB (e.g. deployed in vulcano-common).
  enabled: true
  # -- External MongoDB host. When set (and enabled=false), Vulcano connects to this host.
  # Credentials from auth.rootUsername / auth.rootPassword (or auth.existingSecret) are still used.
  # Example: "mongodb-headless.vulcano-common.svc.cluster.local"
  externalHost: ""
  # -- MongoDB port Vulcano connects to (defaults to 27017). Override for non-standard external ports.
  port: 27017
  # -- Full name override for MongoDB resources
  fullnameOverride: "mongodb"
  # -- MongoDB database name used by Vulcano (defaults to 'vulcano' if not set)
  database: "vulcano"
  # -- Number of MongoDB replicas
  replicaCount: 3

  replicaSet:
    # -- Enable MongoDB replica set mode. Required when replicaCount > 1.
    # Switches the connection to the headless service and emits replica-set-name.
    enabled: true
    # -- MongoDB replica set name. Must match the name the sub-chart was initialized with.
    name: "rs0"

  auth:
    # -- MongoDB root username
    rootUsername: "root"
    # -- MongoDB root password (ignored when existingSecret is set)
    rootPassword: "bitte"
    # -- Name of an existing Kubernetes Secret containing MongoDB credentials.
    # When set, rootPassword is ignored and the chart will NOT create a mongodb-credentials secret.
    existingSecret: ""
    # -- Key inside existingSecret that holds the root password (chart default: "mongodb-root-password")
    existingSecretPasswordKey: "mongodb-root-password"

  persistence:
    # -- Enable MongoDB persistence
    enabled: true
    # -- MongoDB persistent volume size
    size: "50Gi"
    # -- Storage class name for MongoDB
    storageClassName: ""


  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "1000m"
      memory: "2Gi"

  metrics:
    enabled: false

# -- MongoDB → S3 backup (optional)
# Runs the moovit/mongodb-s3-backup image as a long-running Deployment that
# `mongodump`s MongoDB and uploads to S3 (initial backup on start, then the
# image's own internal ~24h loop — same as the Docker Swarm setup). Enable it
# in the release that owns the MongoDB you want to back up (e.g. vulcano-common
# for the shared instance). Connection details default to the chart's mongodb.*
# config; only the S3 destination + AWS credentials are required.
mongoBackup:
  # -- Enable the MongoDB backup Deployment
  enabled: false
  image:
    # -- Backup image repository
    repository: docker.io/moovit/mongodb-s3-backup
    # -- Backup image tag
    tag: latest
    # -- Backup image pull policy
    pullPolicy: IfNotPresent
  # -- Take a backup immediately on pod start (INIT_BACKUP). After that the
  # image loops on its own internal ~24h timer.
  initBackup: true
  # -- Timezone for the container (IANA name); affects backup timestamp naming. Empty = UTC.
  timezone: "Europe/Berlin"
  # -- Number of backups to keep in S3 (older ones are pruned)
  retainCount: 30
  # -- Specific database to dump (MONGODB_DB). Empty = all databases.
  database: ""
  # -- Extra mongodump flags. Defaults pin the auth database for the root user.
  extraOpts: "--authenticationDatabase admin"
  # -- MongoDB connection overrides. Blank values derive from the mongodb.* config.
  mongo:
    # -- Override MongoDB host (default: derived from mongodb config)
    host: ""
    # -- Override MongoDB port (default: derived from mongodb.port)
    port: ""
    # -- Override MongoDB user (default: mongodb.auth.rootUsername)
    username: ""
  s3:
    # -- Target S3 bucket name
    bucket: ""
    # -- Folder/prefix inside the bucket
    backupFolder: ""
    # -- Bucket region (BUCKET_REGION). Optional.
    region: ""
    # -- Custom S3-compatible endpoint URL (ENDPOINT_URL). Optional.
    endpointUrl: ""
    # -- Name of an existing Secret holding the AWS credentials. When set, the
    # chart does NOT create the mongo-backup-credentials secret.
    existingSecret: ""
    # -- Key in existingSecret holding the access key id
    existingSecretAccessKeyIdKey: "AWS_ACCESS_KEY_ID"
    # -- Key in existingSecret holding the secret access key
    existingSecretSecretAccessKeyKey: "AWS_SECRET_ACCESS_KEY"
    # -- AWS access key id (used only when existingSecret is empty; put in values.secret.yaml)
    accessKeyId: ""
    # -- AWS secret access key (used only when existingSecret is empty; put in values.secret.yaml)
    secretAccessKey: ""
  # -- Resource requests/limits for the backup container
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  # -- Node selector for the backup pod (falls back to chart-level nodeSelector)
  nodeSelector: {}
  # -- Tolerations for the backup pod (falls back to chart-level tolerations)
  tolerations: []
  # -- Affinity for the backup pod (falls back to chart-level affinity)
  affinity: {}

# -- RabbitMQ Configuration
rabbitmq:
  # -- Enable RabbitMQ deployment as part of this release.
  # Set to false when using an external RabbitMQ (e.g. deployed in vulcano-common).
  enabled: true
  # -- External RabbitMQ host. When set (and enabled=false), Vulcano connects to this host.
  # Credentials from auth.username / auth.password (or auth.existingSecret) are still used.
  # Example: "rabbitmq.vulcano-common.svc.cluster.local"
  externalHost: ""
  # -- RabbitMQ AMQP port Vulcano connects to (defaults to 5672). Override for non-standard external ports.
  port: 5672
  # -- Full name override for RabbitMQ resources
  fullnameOverride: "rabbitmq"
  # -- Number of RabbitMQ replicas. 1 = single node (default); scale up for HA —
  # clustering is pre-enabled (peerDiscoveryK8sPlugin) so >1 forms a real cluster, not
  # split-brain. The classic priority job queue isn't message-replicated, but the server
  # rebuilds it from the DB, so in-flight jobs re-queue after a node failure.
  replicaCount: 1
  # -- K8s peer-discovery clustering. Pre-enabled so scaling replicaCount >1 forms one
  # real RabbitMQ cluster instead of independent split-brain brokers. Harmless at 1 replica.
  peerDiscoveryK8sPlugin:
    enabled: true

  auth:
    # -- Erlang cookie for RabbitMQ clustering (ignored when existingSecret is set)
    erlangCookie: "VULCANO_SECRET_COOKIE"
    # -- RabbitMQ admin username
    username: "vulcano"
    # -- RabbitMQ admin password (ignored when existingSecret is set)
    password: "vulcano0479"
    # -- Name of an existing Kubernetes Secret containing RabbitMQ credentials.
    # When set, password and erlangCookie are ignored and the chart will NOT create a rabbitmq-credentials secret.
    existingSecret: ""
    # -- Key inside existingSecret that holds the RabbitMQ password.
    # Default "password" matches the keys written by the cloudpirates/rabbitmq
    # sub-chart's own Secret. Override only when pointing at an externally
    # managed Secret that uses a different key name (e.g. "rabbitmq-password"
    # from a Bitwarden mapping or legacy Bitnami secret).
    existingPasswordKey: "password"
    # -- Key inside existingSecret that holds the Erlang cookie
    existingErlangCookieKey: "erlang-cookie"

  service:
    # -- RabbitMQ service type (ClusterIP, NodePort, LoadBalancer)
    type: NodePort

  persistence:
    # -- Enable RabbitMQ persistence. Off is fine for a single node (jobs rebuild from
    # the DB). Enable when scaling >1 so cluster metadata survives pod reschedules.
    enabled: false
    # -- RabbitMQ persistent volume size
    # size: "10Gi"

  resources:
    limits:
      cpu: "1000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

  metrics:
    # -- Enable RabbitMQ metrics
    enabled: false

  # -- Name of the RabbitMQ queue used as the return channel from render nodes back to the server.
  # Only set this if you need to run multiple isolated Vulcano instances sharing the same RabbitMQ broker.
  # Defaults to "vulcano-job-updates" when not set.
  jobUpdateQueue: "vulcano-job-updates"

# RBAC Configuration
rbac:
  create: true

# Service Account
serviceAccount:
  create: true
  name: vulcano
  annotations: {}

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

# SMB CSI Driver Configuration (Optional)
smbCsi:
  enabled: false
  username: "username"
  password: "password"
  # -- Optional Active Directory domain for SMB authentication. When set, the
  # CSI driver passes `domain=<value>` to mount.cifs instead of relying on
  # DOMAIN\username parsing. Leave empty for non-AD shares or when the
  # username field already carries the domain prefix.
  domain: ""
  uri: "//xxx.xxx.xxx.xxx/mountpoint"

# Logging Configuration
logging:
  # -- Log directory (Spring `logging.file.path`). Sourced solely from the
  # ConfigMap. Only used when `fileName` is empty; a full-path `fileName` wins.
  filePath: "/data/logs"
  # -- Full path to the log file (Spring `logging.file.name`); takes precedence
  # over `filePath`. Sourced solely from the ConfigMap.
  fileName: "/data/LOGS/vulcano_k8s.log"
  # -- Maximum size of the log file before it gets rotated
  fileMaxSize: "10MB"
  level:
    # -- Logging level for the org package
    org: "INFO"
    # -- Logging level for the security filter
    securityFilter: "WARN"

# Management/Metrics Configuration
management:
  endpoints:
    web:
      exposure:
        # -- Comma-separated list of actuator endpoints to expose via web
        include: "health,beans,loggers,env,prometheus,metrics"
  endpoint:
    caches:
      # -- Enable the caches actuator endpoint
      enabled: "true"
    prometheus:
      # -- Enable the Prometheus actuator endpoint
      enabled: "true"
    health:
      # -- When to show full health details in the health endpoint response
      showDetails: "always"
      group:
        readiness:
          # -- Components to include in the readiness health check
          include: "rabbit,diskSpace,mongo,ping"
  prometheus:
    metrics:
      export:
        enabled: "true"
  metrics:
    tags:
      application: "vulcano-backend"
    distribution:
      percentilesHistogram: "true"
      slo: "50ms, 100ms, 200ms, 300ms, 500ms, 1s"
    enable:
      all: "true"
  health:
    livenessstate:
      # -- Enable the liveness state health indicator
      enabled: "true"
      # -- Show detailed information in liveness state health checks
      showDetails: "always"
    readinessstate:
      # -- Enable the readiness state health indicator
      enabled: "true"
      # -- Show detailed information in readiness state health checks
      showDetails: "always"
  # OpenTelemetry (OTLP) export (Vulcano 1.9.31+). Exports distributed traces,
  # metrics, and structured logs to an OTLP collector (OpenTelemetry Collector,
  # Grafana/Tempo, Jaeger, etc.). All signals are DISABLED by default; enable
  # per signal and point each at your collector. Endpoints default to a local
  # collector on :4318. Each leaf notes the exact Spring property it maps to.
  otlp:
    tracing:
      # -- Enable trace export. → management.tracing.export.enabled
      enabled: "false"
      # -- OTLP traces endpoint. → management.opentelemetry.tracing.export.otlp.endpoint
      endpoint: "http://localhost:4318/v1/traces"
      # -- Fraction of traces to sample (0.0–1.0; 0.1 = 10% for prod, 1.0 for
      # dev). → management.tracing.sampling.probability
      samplingProbability: "0.1"
    metrics:
      # -- Enable metrics export. → management.otlp.metrics.export.enabled
      enabled: "false"
      # -- OTLP metrics endpoint. → management.otlp.metrics.export.url
      endpoint: "http://localhost:4318/v1/metrics"
    logging:
      # -- Enable log export. → management.logging.export.enabled
      enabled: "false"
      # -- OTLP logs endpoint. → management.opentelemetry.logging.export.otlp.endpoint
      endpoint: "http://localhost:4318/v1/logs"

# Spring Framework Configuration
spring:
  mvc:
    pathmatch:
      matchingStrategy: "ANT_PATH_MATCHER"
  jackson:
    mapper:
      acceptCaseInsensitiveEnums: "true"
    defaultPropertyInclusion: "NON_NULL"
  jpa:
    hibernate:
      ddlAuto: "update"
      naming:
        physicalStrategy: "org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl"
  main:
    lazyInitialization: "false"
  threads:
    virtual:
      enabled: "false"
  servlet:
    multipart:
      enabled: "true"

# SpringDoc Configuration
springdoc:
  swaggerUi:
    path: "/doc"

# Vulcano Folder Configuration
folders:
  # -- Path mapping configuration for render nodes in distributed rendering setups
  pathMapRenderNode: "Z:"
  # -- Server-side path mapping configuration for shared storage access
  pathMapServer: "/data"
  # -- Name of a Kubernetes Secret whose keys are mounted as certificate files into /etc/certs inside the Vulcano pod.
  # Each key in the Secret becomes a file at /etc/certs/<key>.
  # Leave empty to disable the certificate mount.
  customCertificatesSecret: ""
  # -- Root directory path containing all After Effects templates and project files
  templates: "/data/templates"
  media:
    # -- Root directory path where generated high-resolution media files are stored
    folder: "/data/highres"
    # -- Comma-separated list of allowed media file extensions for processing
    extension: ".mov"
    # -- Client-side path mapping for media files in path replacement operations
    clientFolder: "/data/highres"
    # -- Directory path containing After Effects project templates and MOGRT files
    templatesFolder: "/data/highres_templates"
  output:
    # -- Folder path where deleted high-resolution rendered files are moved before permanent deletion
    deletedFolder: "/highres_deleted"
  # -- Directory path where low-resolution proxy files are stored
  proxy: "/data/lowres"
  # -- Directory path where thumbnail images are stored
  thumbnails: "/data/thumbs"
  # -- Client-side path mapping for template files
  templatesClient: ""
  # -- Active fonts folder for the Font Manager (Vulcano 1.9.31+). Holds fonts
  # that are active and distributed to render nodes; must sit on the shared PVC.
  # Leave empty to derive `<vulcano.storage.mountPath>/fonts` automatically, so it
  # follows the mount for every deployment without a per-environment override.
  # → vulcano.folderscanner.fontFolder
  fonts: ""
  # -- Inactive (deactivated) fonts folder, backend-managed and not used in
  # rendering. Empty derives `<vulcano.storage.mountPath>/fonts_inactive`.
  # → vulcano.folderscanner.fontInactiveFolder
  fontsInactive: ""

# Vulcano Scanner Configuration
folderScanner:
  # -- Enable Delta Tre sports data integration
  startD3: "false"
  # -- Enable automatic file system monitoring to detect changes in template folders
  startWatcher: "true"
  # -- Maximum folder depth level for recursive scanning operations
  maxDepth: "10"
  # -- Allow creation and preservation of empty folders in the file system structure
  allowEmptyFolder: "true"
  # -- Automatically re-render missing high-resolution files when detected during system checks
  recreateMissingHighres: "true"
  # -- Default folder name used for organizing templates and assets when no specific bin is specified
  defaultBin: "Templates"

# Additional Scanner Configuration
folderscanner:
  mediaFolder:
    # -- Recreate the folder structure for media folders
    recreateFolderStructure: "true"
    templates:
      # -- Client-side path mapping for template media files. Used to replace server template paths with client-accessible paths in HiresApiDelegateImpl.mapHiresPath() for template folder access
      client: "/Volumes/helmut_1/vulcano/highres_templates"

# ---------------------------------------------------------------------------
# Integrations – preferred configuration path
# Use these keys to configure all third-party integrations.
# The legacy top-level sections (helmut, vidispine, ndr, vdb, octopus) are still
# supported as fallback for backwards compatibility but are deprecated.
# ---------------------------------------------------------------------------
integrations:
  # -- Authentication token for Helmut4 media asset management system integration
  helmut:
    # -- Authentication token for Helmut4 media asset management system integration
    apiToken: ""
    # -- Base URL of the Helmut4 server API (e.g., https://helmut.company.com/api)
    baseUrl: ""
    # -- OAuth client identifier for Helmut4 API authentication
    clientId: ""
    # -- OAuth client secret for secure Helmut4 API authentication
    clientSecret: ""
    # -- Name of an existing K8s Secret containing the Helmut4 client secret (when set, clientSecret is ignored)
    existingSecret: ""
    # -- Key inside existingSecret that holds the client secret
    existingPasswordKey: "helmut-client-secret"
    # -- Base breadcrumb path for Helmut4 Cosmo workspace navigation
    cosmoBaseBreadcrumb: ""
    # -- Destination path mapping for Helmut4 Cosmo integration
    cosmoMappingDest: ""
    # -- Source path mapping for Helmut4 Cosmo integration
    cosmoMappingSrc: ""
    # -- Enable synchronization between Vulcano assets and Helmut4 Cosmo workspace
    cosmoSync: "false"
    # -- Enable detailed logging of HTTP requests made to Helmut4 API
    logRequest: "false"
    # -- Number of items per page when fetching data from Helmut4 API
    pageSize: "50"
  # -- URL endpoint for looking up BID information in the NDR VDB system
  ndr:
    # -- URL endpoint for looking up BID (Broadcast ID) information in the NDR VDB system
    bidLookupUrl: ""
    # -- Password for authenticating with the NDR VDB system
    vdbPassword: ""
    # -- Name of an existing K8s Secret containing the NDR VDB password (when set, vdbPassword is ignored)
    existingSecret: ""
    # -- Key inside existingSecret that holds the VDB password
    existingPasswordKey: "ndr-vdb-password"
    # -- Server hostname or URL for the NDR VDB system
    vdbServer: ""
    # -- Enable simulation mode for VDB operations without making actual network calls
    vdbSimulate: "false"
    # -- Username for authenticating with the NDR VDB system
    vdbUsername: ""
    # -- URL to the NDR VDB documentation wiki
    wikiUrl: ""
    # -- Wildcard BID pattern used for broadcast ID matching in the NDR VDB system
    wildcardBid: ""
  # -- API endpoint URL for Octopus newsroom system integration
  octopus:
    # -- Enable Octopus newsroom system integration
    enabled: false
    # -- API endpoint URL for Octopus newsroom system integration
    api: ""
    # -- Delay in milliseconds between Octopus client polling requests
    clientDelayInMs: "5000"
    # -- Password for authenticating with the Octopus newsroom system
    password: ""
    # -- Name of an existing K8s Secret containing the Octopus password (when set, password is ignored)
    existingSecret: ""
    # -- Key inside existingSecret that holds the password
    existingPasswordKey: "octopus-password"
    # -- Enable the Octopus client for receiving and processing MOS messages
    startClient: "false"
    # -- Username for authenticating with the Octopus newsroom system
    username: ""
  # -- Base URL for Vidispine media asset management system API
  vidispine:
    # -- Base URL for Vidispine media asset management system API
    baseUrl: ""
    # -- Authentication endpoint URL for Vidispine system
    baseUrlAuth: ""
    # -- OAuth client identifier for Vidispine API authentication
    clientId: ""
    # -- OAuth client secret for secure Vidispine API authentication
    clientSecret: ""
    # -- Name of an existing K8s Secret containing the Vidispine client secret (when set, clientSecret is ignored)
    existingSecret: ""
    # -- Key inside existingSecret that holds the client secret
    existingPasswordKey: "vidispine-client-secret"
    # -- Default location value to be pre-selected in the location selector
    defaultLocation: ""
    # -- URL for retrieving allowed values for the Location metadata field from Vidispine
    locationValuesUrl: ""
    # -- Vidispine storage identifier for file operations
    storage: ""
    # -- Default workflow identifier in Vidispine for processing uploaded assets
    workflow: ""
    # -- Specific workflow identifier for MOGRT files in Vidispine
    workflowMogrt: ""
    # -- Version number of the default Vidispine workflow to use
    workflowVersion: ""
    # -- Version number of the MOGRT-specific workflow in Vidispine
    workflowVersionMogrt: ""
  # -- Adobe Creative Cloud Libraries integration
  adobe:
    # -- Enable Adobe Creative Cloud Libraries integration for syncing MOGRT templates
    enabled: false
    # -- OAuth access token for Adobe Creative Cloud Libraries API authentication
    clientToken: ""
    # -- Adobe IMS Client ID for OAuth authentication flow
    clientId: ""
    # -- Adobe IMS Client Secret for OAuth authentication
    secret: ""
    # -- Enable automatic synchronization of Adobe Creative Cloud Libraries every 2 minutes
    scan: "false"
    # -- File path where a JSON dump of all available Adobe CC Libraries elements will be created
    dumpFilepath: ""
    # -- Adobe API Key for accessing Adobe Creative Cloud services
    apiKey: "CCHomeWeb1"
    # -- Comma-separated list of Adobe Creative Cloud Library names that should be excluded from synchronization
    librariesIgnore: '"Library to Ignore"'

# Vulcano Feature Configuration
features:
  # -- Ignore MOGRT files during template scanning and processing
  ignoreMogrt: "false"
  # -- Maximum character limit for asset names and file names
  maxNameLength: "200"
  # -- Enable detailed logging of all HTTP requests made to external APIs
  logThirdPartyRequests: "false"
  # -- Enable After Effects rendering functionality
  afxRender: "true"
  # -- Enable creation of MOGRT files during rendering
  afxCreateMogrt: "true"
  # -- Enable preview rendering functionality in AfxRenderer
  afxRenderPreview: "true"
  # -- Maximum number of assets that can be rendered simultaneously in mass rendering operations
  afxRenderMassJobLimit: "-1"
  # -- Enable on-demand rendering capabilities
  afxRenderOnDemand: "false"
  # -- If enabled, users can both add an asset to a project and mark it as 'Preparing'
  afxRenderOnDemandExtended: "false"
  # -- Comma-separated list of After Effects render templates selectable per
  # project in preferences (Vulcano 1.9.31+). Empty falls back to the global
  # template. → vulcano.afx.render.templates
  afxRenderTemplates: ""
  # -- Enable cloud-based rendering mode
  cloudmode: "false"

# Housekeeping Configuration
housekeeping:
  # -- Enable automatic cleanup and maintenance tasks
  enabled: "false"
  # -- Maximum age in days for housekeeping items before they are automatically cleaned up
  maxAge: "14"

