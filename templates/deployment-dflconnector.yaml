{{- if .Values.dflconnector.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dflconnector
  namespace: {{ include "vulcano.namespace" . }}
  labels:
    {{- include "vulcano.labels" . | nindent 4 }}
    app: dflconnector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vulcano.selectorLabels" . | nindent 6 }}
      app: dflconnector
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "vulcano.selectorLabels" . | nindent 8 }}
        app: dflconnector
    spec:
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets.secrets }}
        - name: {{ .name }}
        {{- end }}
      {{- end }}

      containers:
        - name: dflconnector
          image: "{{ .Values.images.dflconnector.repository }}:{{ .Values.images.dflconnector.tag }}"
          imagePullPolicy: {{ .Values.images.dflconnector.pullPolicy | default "IfNotPresent" }}

          ports:
            - name: http
              containerPort: {{ .Values.dflconnector.port | default 8080 }}
              protocol: TCP

          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Dlogging.file.path=/app/logs
                -Dlogging.file.name=dflconnector.log
            {{- range $key, $val := .Values.dflconnector.properties }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: vulcano.base.service_admin_username
              value: "service_admin"
            - name: vulcano.base.service_admin_password
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulcano.serviceAdminPassword.secretName" . }}
                  key: {{ include "vulcano.serviceAdminPassword.secretKey" . }}
            # MongoDB – derived from chart-level mongodb configuration
            {{- include "vulcano.mongodb.env" . | nindent 12 }}

          resources:
            {{- toYaml .Values.dflconnector.resources | nindent 12 }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}

      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}

      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: dflconnector
  namespace: {{ include "vulcano.namespace" . }}
  labels:
    {{- include "vulcano.labels" . | nindent 4 }}
    app: dflconnector
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.dflconnector.port | default 8080 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vulcano.selectorLabels" . | nindent 4 }}
    app: dflconnector
{{- end }}
