{{- if .Values.filetransfer.enabled }}
{{- if .Values.filetransfer.zdfTargets }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filetransfer-zdf-targets
  namespace: {{ include "vulcano.namespace" . }}
  labels:
    {{- include "vulcano.labels" . | nindent 4 }}
    app: filetransfer
data:
  zdf-targets.json: |
    {{ .Values.filetransfer.zdfTargets | toJson | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.filetransfer.name | default "vulcano-transfer" }}
  namespace: {{ include "vulcano.namespace" . }}
  labels:
    {{- include "vulcano.labels" . | nindent 4 }}
    app: filetransfer
spec:
  replicas: 1
  strategy:
    type: {{ include "vulcano.deploymentStrategy" . }}
  selector:
    matchLabels:
      {{- include "vulcano.selectorLabels" . | nindent 6 }}
      app: filetransfer
  template:
    metadata:
      annotations:
        checksum/credentials: {{ include "vulcano.serviceAdminPassword" . | sha256sum | quote }}
        {{- if .Values.filetransfer.tams.password }}
        checksum/tams-credentials: {{ .Values.filetransfer.tams.password | sha256sum | quote }}
        {{- end }}
        {{- if .Values.filetransfer.zdfTargets }}
        checksum/zdf-targets: {{ .Values.filetransfer.zdfTargets | toJson | sha256sum | quote }}
        {{- end }}
      labels:
        {{- include "vulcano.selectorLabels" . | nindent 8 }}
        app: filetransfer
    spec:
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets.secrets }}
        - name: {{ .name }}
        {{- end }}
      {{- end }}

      containers:
        - name: filetransfer
          image: "{{ .Values.images.filetransfer.repository }}:{{ .Values.images.filetransfer.tag }}"
          imagePullPolicy: {{ .Values.images.filetransfer.pullPolicy | default "IfNotPresent" }}

          ports:
            - name: http
              containerPort: {{ .Values.filetransfer.port | default 8999 }}
              protocol: TCP

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Dlogging.file.path=/app/logs -Dlogging.file.name=filetransfer.log"
            {{- /* server.port, the Vulcano base URL and the TAMS password are
                   derived below, so skip any copies in properties to keep a
                   single source of truth. */}}
            {{- range $key, $val := .Values.filetransfer.properties }}
            {{- if not (has $key (list "server.port" "vulcano.baseUrl" "tams.password")) }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
            - name: server.port
              value: {{ .Values.filetransfer.port | default 8999 | quote }}
            - name: vulcano.baseUrl
              value: {{ include "vulcano.backendUrl" . | quote }}
            - name: vulcano.password
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulcano.serviceAdminPassword.secretName" . }}
                  key: {{ include "vulcano.serviceAdminPassword.secretKey" . }}
            - name: vulcano.username
              value: {{ include "vulcano.serviceAdminUsername" . | quote }}
            {{- if or .Values.filetransfer.tams.password .Values.filetransfer.tams.existingSecret }}
            - name: tams.password
              valueFrom:
                secretKeyRef:
                  {{- if .Values.filetransfer.tams.existingSecret }}
                  name: {{ .Values.filetransfer.tams.existingSecret }}
                  key: {{ .Values.filetransfer.tams.existingSecretKey | default "tams-password" }}
                  {{- else }}
                  name: tams-credentials
                  key: tams-password
                  {{- end }}
            {{- end }}

          resources:
            {{- toYaml .Values.filetransfer.resources | nindent 12 }}

          volumeMounts:
            - name: data
              mountPath: {{ .Values.vulcano.storage.mountPath }}
              readOnly: true
            {{- range $mount := .Values.vulcano.storage.extraMounts }}
            - name: {{ $mount.name }}
              mountPath: {{ $mount.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.filetransfer.zdfTargets }}
            - name: zdf-targets
              mountPath: /zdf-targets.json
              subPath: zdf-targets.json
            {{- end }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.vulcano.storage.existingClaim | default .Values.vulcano.storage.pvc }}
            readOnly: true
        {{- range $mount := .Values.vulcano.storage.extraMounts }}
        - name: {{ $mount.name }}
          persistentVolumeClaim:
            claimName: {{ $mount.existingClaim | default ($mount.pvc | default (printf "vulcano-%s" $mount.name)) }}
            readOnly: true
        {{- end }}
        {{- if .Values.filetransfer.zdfTargets }}
        - name: zdf-targets
          configMap:
            name: filetransfer-zdf-targets
        {{- end }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}

      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}

      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.filetransfer.name | default "vulcano-transfer" }}
  namespace: {{ include "vulcano.namespace" . }}
  labels:
    {{- include "vulcano.labels" . | nindent 4 }}
    app: filetransfer
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.filetransfer.port | default 8999 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vulcano.selectorLabels" . | nindent 4 }}
    app: filetransfer
{{- end }}
