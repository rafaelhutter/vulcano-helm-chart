{{- if .Values.vulcano.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vulcano.fullname" . }}
  namespace: {{ include "vulcano.namespace" . }}
  labels:
    {{- include "vulcano.labels" . | nindent 4 }}
    app: vulcano
  {{- with (include "vulcano.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.vulcano.replicaCount }}
  strategy:
    type: {{ include "vulcano.deploymentStrategy" . }}
  selector:
    matchLabels:
      {{- include "vulcano.selectorLabels" . | nindent 6 }}
      app: vulcano
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "vulcano.selectorLabels" . | nindent 8 }}
        app: vulcano
    spec:
      serviceAccountName: {{ include "vulcano.serviceAccountName" . }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets.secrets }}
        - name: {{ .name }}
        {{- end }}
      {{- end }}

      containers:
        - name: vulcano
          image: "{{ .Values.images.vulcano.repository }}:{{ .Values.images.vulcano.tag }}"
          imagePullPolicy: {{ .Values.images.vulcano.pullPolicy }}
          
          ports:
            - name: http
              containerPort: 8889
              protocol: TCP

          {{- if .Values.vulcano.livenessProbe.enabled }}
          livenessProbe:
            initialDelaySeconds: {{ .Values.vulcano.livenessProbe.initialDelaySeconds }}
            failureThreshold: {{ .Values.vulcano.livenessProbe.failureThreshold }}
            periodSeconds: {{ .Values.vulcano.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.vulcano.livenessProbe.timeoutSeconds }}
            httpGet:
              path: /actuator/health/liveness
              port: http
          {{- end }}

          {{- if .Values.vulcano.readinessProbe.enabled }}
          readinessProbe:
            initialDelaySeconds: {{ .Values.vulcano.readinessProbe.initialDelaySeconds }}
            failureThreshold: {{ .Values.vulcano.readinessProbe.failureThreshold }}
            periodSeconds: {{ .Values.vulcano.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.vulcano.readinessProbe.timeoutSeconds }}
            httpGet:
              path: /actuator/health/readiness
              port: http
          {{- end }}

          resources:
            {{- toYaml .Values.vulcano.resources | nindent 12 }}

          env:
            # Logging Configuration
            - name: JAVA_TOOL_OPTIONS
              value: "-Dlogging.file.path={{ .Values.vulcano.storage.mountPath }}/logs -Dlogging.file.name={{ .Values.logging.fileName }}"

            # Service-admin password is sourced from the vulcano-credentials
            # Secret rather than the configmap so the value doesn't sit in
            # plaintext config (and so the same secret feeds dflconnector +
            # filetransfer, keeping all three sides in sync).
            - name: auth.service_admin_password
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulcano.serviceAdminPassword.secretName" . }}
                  key: {{ include "vulcano.serviceAdminPassword.secretKey" . }}

            # Auth token-signing secret — sourced from a Secret, never the
            # ConfigMap, so it never sits in plaintext.
            - name: auth.secret
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulcano.authSecret.secretName" . }}
                  key: {{ include "vulcano.authSecret.secretKey" . }}

            # MongoDB Configuration
            {{- include "vulcano.mongodb.env" . | nindent 12 }}

            # RabbitMQ Configuration
            - name: spring.rabbitmq.host
              value: {{ include "vulcano.rabbitmq.host" . | quote }}
            - name: spring.rabbitmq.port
              value: {{ .Values.rabbitmq.port | default 5672 | quote }}
            {{- if or .Values.rabbitmq.enabled .Values.rabbitmq.externalHost }}
            - name: spring.rabbitmq.username
              valueFrom:
                secretKeyRef:
                  {{- if .Values.rabbitmq.auth.existingSecret }}
                  name: {{ .Values.rabbitmq.auth.existingSecret }}
                  key: {{ .Values.rabbitmq.auth.existingUsernameKey | default "username" }}
                  {{- else }}
                  name: rabbitmq-credentials
                  key: username
                  {{- end }}
            - name: spring.rabbitmq.password
              valueFrom:
                secretKeyRef:
                  {{- if .Values.rabbitmq.auth.existingSecret }}
                  name: {{ .Values.rabbitmq.auth.existingSecret }}
                  key: {{ .Values.rabbitmq.auth.existingPasswordKey | default "password" }}
                  {{- else }}
                  name: rabbitmq-credentials
                  key: password
                  {{- end }}
            {{- end }}

            # License Configuration — sourced from a Secret, never the ConfigMap,
            # so the JWT key doesn't sit in plaintext in Git or the ConfigMap.
            {{- if or .Values.vulcano.license.key .Values.vulcano.license.existingSecret }}
            - name: vulcano.license.key
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulcano.license.secretName" . }}
                  key: {{ include "vulcano.license.secretKey" . }}
            {{- end }}

            # NOTE: plain (non-secret) config lives in the ConfigMap and is
            # injected wholesale via `envFrom: configMapRef` below — including
            # dotted keys like vulcano.pathmap.* and login.mode. Only
            # secret-backed values need explicit env entries here.

            # Integration Secrets
            {{- if or .Values.integrations.helmut.existingSecret (coalesce .Values.integrations.helmut.clientSecret .Values.helmut.clientSecret) }}
            - name: vulcano.data.helmut.clientSecret
              valueFrom:
                secretKeyRef:
                  {{- if .Values.integrations.helmut.existingSecret }}
                  name: {{ .Values.integrations.helmut.existingSecret }}
                  key: {{ .Values.integrations.helmut.existingPasswordKey | default "helmut-client-secret" }}
                  {{- else }}
                  name: helmut-credentials
                  key: helmut-client-secret
                  {{- end }}
            {{- end }}
            {{- if or .Values.integrations.ndr.existingSecret .Values.integrations.ndr.vdbPassword }}
            - name: ndr.vdb.password
              valueFrom:
                secretKeyRef:
                  {{- if .Values.integrations.ndr.existingSecret }}
                  name: {{ .Values.integrations.ndr.existingSecret }}
                  key: {{ .Values.integrations.ndr.existingPasswordKey | default "ndr-vdb-password" }}
                  {{- else }}
                  name: ndr-credentials
                  key: ndr-vdb-password
                  {{- end }}
            {{- end }}
            {{- if or .Values.integrations.vidispine.baseUrl .Values.vidispine.baseUrl }}
            - name: vulcano.vidispine.clientSecret
              valueFrom:
                secretKeyRef:
                  {{- if .Values.integrations.vidispine.existingSecret }}
                  name: {{ .Values.integrations.vidispine.existingSecret }}
                  key: {{ .Values.integrations.vidispine.existingPasswordKey | default "vidispine-client-secret" }}
                  {{- else }}
                  name: vidispine-credentials
                  key: vidispine-client-secret
                  {{- end }}
            {{- end }}
            {{- if .Values.integrations.octopus.enabled }}
            - name: octopus.password
              valueFrom:
                secretKeyRef:
                  {{- if .Values.integrations.octopus.existingSecret }}
                  name: {{ .Values.integrations.octopus.existingSecret }}
                  key: {{ .Values.integrations.octopus.existingPasswordKey | default "octopus-password" }}
                  {{- else }}
                  name: octopus-credentials
                  key: octopus-password
                  {{- end }}
            {{- end }}
            {{- if eq .Values.auth.mode "KEYCLOAK" }}
            - name: auth.keycloak.clientSecret
              valueFrom:
                secretKeyRef:
                  {{- if .Values.auth.keycloak.existingSecret }}
                  name: {{ .Values.auth.keycloak.existingSecret }}
                  key: {{ .Values.auth.keycloak.existingPasswordKey | default "keycloak-client-secret" }}
                  {{- else }}
                  name: keycloak-credentials
                  key: keycloak-client-secret
                  {{- end }}
            {{- end }}

            {{- with .Values.vulcano.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          envFrom:
            - configMapRef:
                name: {{ include "vulcano.configmapName" . }}

          volumeMounts:
            - name: data
              mountPath: {{ .Values.vulcano.storage.mountPath }}
            {{- range $mount := .Values.vulcano.storage.extraMounts }}
            - name: {{ $mount.name }}
              mountPath: {{ $mount.mountPath }}
            {{- end }}
            - name: admin-users
              mountPath: /app/admin-users.txt
              subPath: admin-users.txt
            {{- if .Values.folders.customCertificatesSecret }}
            - name: custom-certificates
              mountPath: /etc/certs
              readOnly: true
            {{- end }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.vulcano.storage.existingClaim | default .Values.vulcano.storage.pvc }}
        {{- range $mount := .Values.vulcano.storage.extraMounts }}
        - name: {{ $mount.name }}
          persistentVolumeClaim:
            claimName: {{ $mount.existingClaim | default ($mount.pvc | default (printf "vulcano-%s" $mount.name)) }}
        {{- end }}
        - name: admin-users
          configMap:
            name: admin-users
            items:
              - key: admin-users.txt
                path: admin-users.txt
        {{- if .Values.folders.customCertificatesSecret }}
        - name: custom-certificates
          secret:
            secretName: {{ .Values.folders.customCertificatesSecret }}
        {{- end }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}

      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}

      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}

      {{- if .Values.hostAliases }}
      hostAliases:
        {{- toYaml .Values.hostAliases | nindent 8 }}
      {{- end }}

{{- end }}
